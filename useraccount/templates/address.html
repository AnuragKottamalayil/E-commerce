{% extends 'home.html' %}
{% block home %}
{% load static %}

    <!-- Breadcrumb Section Begin -->
    <section class="breadcrumb-option">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="breadcrumb__text">
                        <h4>Address</h4>
                        <div class="breadcrumb__links">
                            <a href="./index.html">Home</a>
                            <a href="./shop.html">Shop</a>
                            <span>Address</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Breadcrumb Section End -->
    {% if messages %}
    <div class="container mt-3">
        <ul class="messages">
            {% for msg in messages %}       
            
                <div class="alert alert-{{msg.level_tag}}" role="alert">
                    {{msg.message}}
                </div>
        
            {% endfor %}
        </ul>
    </div>
    {% endif %}
    <!-- Checkout Section Begin -->
    <section class="checkout spad">
        <div class="container">
            <!-- {% if messages %}
            <ul class="messages">
                {% for msg in messages %}       
                <li>
                    <div class="alert alert-{{msg.level_tag}}" role="alert">
                        {{msg.message}}
                        </div>
                    </li>
                    {% endfor %}
                </ul>
            {% endif %} -->
            <div class="checkout__form">
                <form method="POST">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-lg-8 col-md-6">
                            <div class="checkout__input">
                                <p>Address<span>*</span></p>
                                <input name="line_1" required type="text" placeholder="Line 1" class="checkout__input__add" value="{{line1}}">
                                <input name="line_2" required type="text" placeholder="Line 2" value="{{line2}}">
                            </div>
                            <div class="checkout__input">
                                <p>Landmark<span></span></p>
                                <input name="landmark" type="text" placeholder="Optional" value="{{landmark}}">
                            </div>
                            <div class="checkout__input">
                                <p>Town/City<span>*</span></p>
                                <input name="city" required type="text" value="{{city}}">
                            </div>
                            <div class="checkout__input">
                                <p>State<span>*</span></p>
                                <input name="state" required type="text" value="{{state}}">
                            </div>
                            <div class="checkout__input">
                                <p>Postcode / ZIP<span>*</span></p>
                                <input name="zipcode" required type="number" value="{{zipcode}}">
                            </div>
                        </div>
                    </div>
                    <a href="{% url 'address' %}"> <button type="submit" class="primary-btn">Save address</button></a>
                </form>
            </div>
        </div>
    </section>
    

{% endblock home %}
